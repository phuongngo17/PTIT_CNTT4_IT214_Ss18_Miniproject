server: { port: 8082 }
spring:
  application.name: customer-service
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource: { url: "${DB_URL:jdbc:h2:mem:customer;DB_CLOSE_DELAY=-1}", username: "${DB_USER:sa}", password: "${DB_PASSWORD:}" }
  jpa: { hibernate.ddl-auto: update, open-in-view: false }
  cache: { type: redis, redis.time-to-live: 10m }
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    repositories.enabled: false
security.jwt.secret: ${JWT_SECRET:rikkeibank-development-secret-key-at-least-32-bytes-long}
eureka.client.serviceUrl.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include: health,info,caches
