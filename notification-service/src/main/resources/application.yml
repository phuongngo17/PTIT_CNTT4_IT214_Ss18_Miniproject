server: { port: 8085 }
spring:
  application.name: notification-service
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource: { url: "${DB_URL:jdbc:h2:mem:notification;DB_CLOSE_DELAY=-1}", username: "${DB_USER:sa}", password: "${DB_PASSWORD:}" }
  jpa: { hibernate.ddl-auto: update, open-in-view: false }
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: com.rikkeibank.common.events
security.jwt.secret: ${JWT_SECRET:rikkeibank-development-secret-key-at-least-32-bytes-long}
eureka.client.serviceUrl.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include: health,info
