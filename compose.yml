x-app: &app
  restart: unless-stopped
  environment: &common-env
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka/
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    JWT_SECRET: ${JWT_SECRET:-rikkeibank-development-secret-key-at-least-32-bytes-long}
    INTERNAL_KEY: ${INTERNAL_KEY:-rikkeibank-internal-development-key}
  networks: [bank]

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: bank, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rikkeibank_local_password}" }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bank"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [bank]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [bank]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"], interval: 10s, timeout: 5s, retries: 20 }
    networks: [bank]
  config-server:
    <<: *app
    build: { context: ., args: { MODULE: config-server } }
    ports: ["8888:8888"]
    environment: {}
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP"], interval: 5s, timeout: 3s, retries: 30 }
  discovery-server:
    <<: *app
    build: { context: ., args: { MODULE: discovery-server } }
    ports: ["8761:8761"]
    environment: {}
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP"], interval: 5s, timeout: 3s, retries: 30 }
  identity-service:
    <<: *app
    build: { context: ., args: { MODULE: identity-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: bank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rikkeibank_local_password}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, config-server: { condition: service_healthy }, discovery-server: { condition: service_healthy } }
  customer-service:
    <<: *app
    build: { context: ., args: { MODULE: customer-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USER: bank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rikkeibank_local_password}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, config-server: { condition: service_healthy }, discovery-server: { condition: service_healthy } }
  account-service:
    <<: *app
    build: { context: ., args: { MODULE: account-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USER: bank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rikkeibank_local_password}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, config-server: { condition: service_healthy }, discovery-server: { condition: service_healthy } }
  transaction-service:
    <<: *app
    build: { context: ., args: { MODULE: transaction-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      DB_USER: bank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rikkeibank_local_password}
      DEMO_FAILURE_INJECTION: "true"
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy }, config-server: { condition: service_healthy }, discovery-server: { condition: service_healthy }, account-service: { condition: service_started } }
  notification-service:
    <<: *app
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: bank
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rikkeibank_local_password}
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy }, config-server: { condition: service_healthy }, discovery-server: { condition: service_healthy } }
  api-gateway:
    <<: *app
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    depends_on: { redis: { condition: service_healthy }, config-server: { condition: service_healthy }, discovery-server: { condition: service_healthy }, identity-service: { condition: service_started }, customer-service: { condition: service_started }, account-service: { condition: service_started }, transaction-service: { condition: service_started }, notification-service: { condition: service_started } }

networks: { bank: {} }
volumes: { postgres-data: {}, redis-data: {} }
