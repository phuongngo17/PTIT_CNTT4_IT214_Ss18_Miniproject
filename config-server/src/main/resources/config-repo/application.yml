eureka:
  client.serviceUrl.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints.web.exposure.include: health,info,circuitbreakers,caches
  endpoint.health.show-details: always
security:
  jwt.secret: ${JWT_SECRET:rikkeibank-development-secret-key-at-least-32-bytes-long}
  internal-key: ${INTERNAL_KEY:rikkeibank-internal-development-key}
spring:
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data.redis.host: ${REDIS_HOST:localhost}
  data.redis.port: ${REDIS_PORT:6379}

