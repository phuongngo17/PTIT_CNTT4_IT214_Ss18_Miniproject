server: { port: 8084 }
spring:
  application.name: transaction-service
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource: { url: "${DB_URL:jdbc:h2:mem:transaction;DB_CLOSE_DELAY=-1}", username: "${DB_USER:sa}", password: "${DB_PASSWORD:}" }
  jpa: { hibernate.ddl-auto: update, open-in-view: false }
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer: { key-serializer: org.apache.kafka.common.serialization.StringSerializer, value-serializer: org.springframework.kafka.support.serializer.JsonSerializer }
security:
  jwt.secret: ${JWT_SECRET:rikkeibank-development-secret-key-at-least-32-bytes-long}
  internal-key: ${INTERNAL_KEY:rikkeibank-internal-development-key}
demo.failure-injection-enabled: ${DEMO_FAILURE_INJECTION:false}
eureka.client.serviceUrl.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
resilience4j.circuitbreaker.instances.accountService:
  sliding-window-size: 5
  minimum-number-of-calls: 3
  failure-rate-threshold: 50
  wait-duration-in-open-state: 10s
  permitted-number-of-calls-in-half-open-state: 2
management.endpoints.web.exposure.include: health,info,circuitbreakers,circuitbreakerevents
